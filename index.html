<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RacketService | Bespannungsverwaltung</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--navy:#16324f;--blue:#1f66ff;--cyan:#22b8cf;--bg:#eef3f7;--card:#fff;--text:#172b4d;--muted:#64748b;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}
    .shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:var(--navy);color:white;padding:24px 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin:0 8px 30px}.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center}
    nav button{width:100%;border:0;color:#cbd5e1;background:transparent;padding:12px 14px;border-radius:8px;text-align:left;cursor:pointer;margin:3px 0}nav button.active,nav button:hover{background:rgba(255,255,255,.12);color:white}
    main{padding:28px 34px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{margin:0;font-size:26px}h2{margin:0 0 16px;font-size:18px}.actions{display:flex;gap:10px}button{font:inherit}.primary{border:0;background:var(--blue);color:white;border-radius:8px;padding:10px 16px;cursor:pointer}.secondary{border:1px solid var(--line);background:white;color:var(--text);border-radius:8px;padding:9px 13px;cursor:pointer}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.stat,.card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(15,23,42,.05)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:7px}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #edf2f7}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;background:#e8f1ff;color:#2455a4}.badge.ready{background:#dcfce7;color:#166534}.badge.progress{background:#fff7d6;color:#8a6200}.view{display:none}.view.active{display:block}
    dialog{width:min(560px,calc(100% - 32px));border:0;border-radius:14px;padding:0;box-shadow:0 20px 60px rgba(15,23,42,.25)}dialog::backdrop{background:rgba(15,23,42,.45)}.dialog-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialog-body{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #ccd6e0;border-radius:8px;padding:10px 12px;background:white;color:var(--text);font:inherit}textarea{min-height:85px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.empty{text-align:center;padding:40px;color:var(--muted)}
    #authScreen{min-height:100vh;display:grid;place-items:center;padding:20px}.authCard{width:min(480px,100%);background:white;border-radius:16px;padding:28px}.authCard h1{text-align:center}.authToggle{text-align:center;margin-top:14px}.authToggle button{border:0;background:none;color:var(--blue);cursor:pointer}.message{text-align:center;font-size:13px}.hidden{display:none!important}
    @media(max-width:800px){.shell{grid-template-columns:1fr}aside{position:sticky;top:0;z-index:5;padding:12px}.brand{display:none}nav{display:flex}nav button{text-align:center}main{padding:20px 14px}.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.actions{display:none}table{display:block;overflow-x:auto}}
  </style>
</head>
<body>
<div id="authScreen"><div class="authCard"><div class="brand" style="justify-content:center;color:var(--text);margin:0 0 12px"><div class="brand-mark">🎾</div>RacketService</div><h1 id="authTitle">Anmelden</h1><form id="authForm"><div id="registerFields" class="hidden grid"><div class="field"><label>Vorname</label><input name="firstname" required></div><div class="field"><label>Nachname</label><input name="lastname" required></div><div class="field"><label>Telefon</label><input name="phone" type="tel"></div><div class="field"><label>Straße und Hausnummer</label><input name="street"></div><div class="field"><label>Postleitzahl</label><input name="postal_code"></div><div class="field"><label>Ort</label><input name="city"></div></div><div class="field"><label>E-Mail</label><input name="email" type="email" required></div><div class="field" style="margin-top:12px"><label>Passwort</label><input name="password" type="password" minlength="6" required></div><button class="primary" style="width:100%;margin-top:14px" id="authSubmit">Anmelden</button><p class="message" id="authMessage"></p></form><div class="authToggle"><button id="authToggle">Noch kein Konto? Jetzt registrieren</button></div></div></div>

<div class="shell hidden" id="app"><aside><div class="brand"><div class="brand-mark">🎾</div>RacketService</div><nav id="nav"><button class="active" data-view="dashboard">Übersicht</button><button data-view="orders">Aufträge</button><button data-view="profile">Mein Profil</button><button class="adminOnly" data-view="customers">Kunden</button><button class="adminOnly" data-view="rackets">Schläger</button></nav><button class="secondary" id="logoutBtn" style="width:100%;margin-top:20px">Abmelden</button></aside><main><header><h1 id="pageTitle">Übersicht</h1><div class="actions"><button class="primary" id="newOrderBtn">+ Neuer Auftrag</button></div></header>
<section id="dashboard" class="view active"><div class="cards"><div class="stat adminOnly"><small>Kunden</small><strong id="customerCount">0</strong></div><div class="stat adminOnly"><small>Schläger</small><strong id="racketCount">0</strong></div><div class="stat"><small>Meine Aufträge</small><strong id="orderCount">0</strong></div></div><div class="card"><h2>Aktuelle Aufträge</h2><div id="recentOrders"></div></div></section>
<section id="orders" class="view"><div class="card"><table><thead><tr><th>Kunde</th><th>Schläger</th><th>Saite</th><th>Zuggewicht</th><th>Status</th></tr></thead><tbody id="orderTable"></tbody></table></div></section>
<section id="profile" class="view"><div class="card"><h2>Meine Kontaktdaten</h2><form id="profileForm"><div class="grid"><div class="field"><label>Vorname</label><input name="firstname" required></div><div class="field"><label>Nachname</label><input name="lastname" required></div><div class="field"><label>E-Mail</label><input name="email" disabled></div><div class="field"><label>Telefon</label><input name="phone"></div><div class="field"><label>Straße und Hausnummer</label><input name="street"></div><div class="field"><label>Postleitzahl</label><input name="postal_code"></div><div class="field"><label>Ort</label><input name="city"></div></div><div class="dialog-actions"><button class="primary">Speichern</button></div><p class="message" id="profileMessage"></p></form></div></section>
<section id="customers" class="view"><div class="card"><table><thead><tr><th>Name</th><th>Telefon</th><th>E-Mail</th><th>Adresse</th></tr></thead><tbody id="customerTable"></tbody></table></div></section>
<section id="rackets" class="view"><div class="card"><table><thead><tr><th>Kunde</th><th>Schläger</th><th>Griff</th></tr></thead><tbody id="racketTable"></tbody></table></div></section>
</main></div>

<dialog id="orderDialog"><div class="dialog-head"><h2>Neuer Auftrag</h2><button class="secondary" onclick="closeOrderDialog()">×</button></div><form class="dialog-body" id="orderForm"><div class="grid"><div class="field"><label>Schlägermodell</label><input name="model" required placeholder="z. B. Wilson Clash 100"></div><div class="field"><label>Griffgröße</label><input name="grip" placeholder="z. B. 2 / 4 ¼"></div><div class="field"><label>Saitenmodell</label><input name="string" required placeholder="z. B. Luxilon ALU Power"></div><div class="field"><label>Zuggewicht (kg)</label><input name="tension" type="number" min="10" max="40" step="0.5" required></div></div><div class="field" style="margin-top:14px"><label>Bemerkung</label><textarea name="notes" placeholder="Besonderer Wunsch, Besaitungsmuster, Abholtermin…"></textarea></div><p class="message" id="orderMessage"></p><div class="dialog-actions"><button type="button" class="secondary" onclick="closeOrderDialog()">Abbrechen</button><button class="primary">Auftrag erstellen</button></div></form></dialog>

<script>
const SUPABASE_URL='https://jaiopyopglxuvrrjdqrk.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_KRRgCz4faQD2tm-gKUEtag_dXf0wwom';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let isRegister=false,isAdmin=false,user=null,profile=null,customers=[],rackets=[],orders=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;'}[c]));
function msg(el,text,error=false){el.textContent=text;el.style.color=error?'#b91c1c':'#15803d';}
$('#authToggle').onclick=()=>{isRegister=!isRegister;$('#authTitle').textContent=isRegister?'Registrieren':'Anmelden';$('#authSubmit').textContent=isRegister?'Registrieren':'Anmelden';$('#authToggle').textContent=isRegister?'Bereits ein Konto? Anmelden':'Noch kein Konto? Jetzt registrieren';$('#registerFields').classList.toggle('hidden',!isRegister);$('#authMessage').textContent='';};
$('#authForm').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),email=d.get('email'),password=d.get('password'),m=$('#authMessage');msg(m,'Bitte warten…');try{if(isRegister){const meta={firstname:d.get('firstname'),lastname:d.get('lastname'),phone:d.get('phone'),street:d.get('street'),postal_code:d.get('postal_code'),city:d.get('city')};const {data,error}=await client.auth.signUp({email,password,options:{data:meta}});if(error)throw error;if(data.session){const {error:pe}=await client.from('customers').upsert({id:data.user.id,email,...meta},{onConflict:'id'});if(pe)throw pe;await startSession();}else msg(m,'Registrierung erfolgreich. Bitte bestätige deine E-Mail-Adresse.');}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;await startSession();}}catch(error){msg(m,error.message,true);}};
async function startSession(){const {data:{session}}=await client.auth.getSession();if(!session){$('#authScreen').classList.remove('hidden');$('#app').classList.add('hidden');return;}user=session.user;$('#authScreen').classList.add('hidden');$('#app').classList.remove('hidden');await loadData();}
async function loadData(){const {data, error}=await client.from('customers').select('*').eq('id',user.id).maybeSingle();if(error){console.error(error);return;}profile=data;if(!profile){const m=user.user_metadata||{};const payload={id:user.id,email:user.email,firstname:m.firstname||'',lastname:m.lastname||'',phone:m.phone||'',street:m.street||'',postal_code:m.postal_code||'',city:m.city||''};const {data:created,error:ce}=await client.from('customers').upsert(payload,{onConflict:'id'}).select().single();if(ce){console.error(ce);return;}profile=created;}isAdmin=profile.is_admin===true;document.querySelectorAll('.adminOnly').forEach(el=>el.classList.toggle('hidden',!isAdmin));fillProfile();if(isAdmin){const [c,r,o]=await Promise.all([client.from('customers').select('*'),client.from('rackets').select('*'),client.from('orders').select('*').order('created_at',{ascending:false})]);customers=c.data||[];rackets=r.data||[];orders=o.data||[];}else{customers=[profile];const [r,o]=await Promise.all([client.from('rackets').select('*').eq('customer_id',user.id),client.from('orders').select('*').eq('customer_id',user.id).order('created_at',{ascending:false})]);rackets=r.data||[];orders=o.data||[];}render();}
function fillProfile(){for(const k of ['firstname','lastname','phone','street','postal_code','city'])$('#profileForm [name="'+k+'"]').value=profile[k]||'';$('#profileForm [name="email"]').value=profile.email||user.email||'';}
$('#profileForm').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),payload={firstname:d.get('firstname'),lastname:d.get('lastname'),phone:d.get('phone'),street:d.get('street'),postal_code:d.get('postal_code'),city:d.get('city')};const {data,error}=await client.from('customers').update(payload).eq('id',user.id).select().single();if(error)msg($('#profileMessage'),error.message,true);else{profile=data;msg($('#profileMessage'),'Kontaktdaten gespeichert.');loadData();}};
function closeOrderDialog(){$('#orderDialog').close();}
$('#newOrderBtn').onclick=()=>{$('#orderMessage').textContent='';$('#orderDialog').showModal();};
$('#orderForm').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),m=$('#orderMessage');msg(m,'Auftrag wird erstellt…');try{const {data:racket,error:racketError}=await client.from('rackets').insert({customer_id:user.id,model:d.get('model'),grip:d.get('grip')}).select().single();if(racketError)throw racketError;const {error:orderError}=await client.from('orders').insert({customer_id:user.id,racket_id:racket.id,string:d.get('string'),tension:Number(d.get('tension')),status:'Neu',notes:d.get('notes')});if(orderError)throw orderError;e.target.reset();closeOrderDialog();await loadData();}catch(error){msg(m,error.message,true);}};
function customerName(id){const c=customers.find(x=>x.id===id);return c?`${c.firstname||''} ${c.lastname||''}`.trim():''}function racketName(id){const r=rackets.find(x=>x.id===id);return r?r.model||'Schläger':''}
function render(){$('#customerCount').textContent=customers.length;$('#racketCount').textContent=rackets.length;$('#orderCount').textContent=orders.filter(o=>o.status!=='Abgeholt').length;$('#orderTable').innerHTML=orders.map(o=>`<tr><td>${esc(customerName(o.customer_id))}</td><td>${esc(racketName(o.racket_id))}</td><td>${esc(o.string||'—')}</td><td>${esc(o.tension||'—')} kg</td><td><span class="badge ${o.status==='Fertig'?'ready':o.status==='In Arbeit'?'progress':''}">${esc(o.status||'Neu')}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Noch keine Aufträge vorhanden</td></tr>';$('#recentOrders').innerHTML=orders.length?`<table><thead><tr><th>Schläger</th><th>Saite</th><th>Status</th></tr></thead><tbody>${orders.slice(0,5).map(o=>`<tr><td>${esc(racketName(o.racket_id))}</td><td>${esc(o.string||'—')}</td><td><span class="badge">${esc(o.status||'Neu')}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Noch keine Aufträge vorhanden</div>';$('#customerTable').innerHTML=customers.map(c=>`<tr><td>${esc(c.firstname)} ${esc(c.lastname)}</td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${esc([c.street,c.postal_code,c.city].filter(Boolean).join(', ')||'—')}</td></tr>`).join('');$('#racketTable').innerHTML=rackets.map(r=>`<tr><td>${esc(customerName(r.customer_id))}</td><td>${esc(r.model||'—')}</td><td>${esc(r.grip||'—')}</td></tr>`).join('');}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');$('#pageTitle').textContent=b.textContent;});$('#logoutBtn').onclick=async()=>{await client.auth.signOut();startSession();};$('#refreshBtn').onclick=loadData;client.auth.onAuthStateChange(()=>startSession());startSession();
</script>
</body>
</html>
