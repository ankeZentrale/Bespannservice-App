<!DOCTYPE html>
<html>
<head>
<title>Supabase Test</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>

<h1>Supabase Test</h1>

<button onclick="testSupabase()">
Verbindung testen
</button>

<div id="result"></div>

<script>

const SUPABASE_URL =
"https://jaiopyopglxuvrrjdqrk.supabase.co";

const SUPABASE_ANON_KEY =
"HIER_DEIN_PUBLISHABLE_KEY";

const { createClient } = supabase;

const client =
createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

async function testSupabase(){

document.getElementById("result").innerHTML =
"Client erstellt ✅";

try{

const { data, error } =
await client.auth.getSession();

if(error){

document.getElementById("result").innerHTML =
"Fehler: " + error.message;

return;
}

document.getElementById("result").innerHTML =
"Supabase verbunden ✅";

}
catch(ex){

document.getElementById("result").innerHTML =
"JavaScript Fehler: " + ex.message;

}

}

</script>

</body>
</html>
