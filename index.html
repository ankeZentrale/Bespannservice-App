<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<button onclick="testSupabase()">
Supabase testen
</button>

<script>

alert("Seite geladen");

const SUPABASE_URL = "https://jaiopyopglxuvrrjdqrk.supabase.co";
const SUPABASE_ANON_KEY = "DEIN_PUBLISHABLE_KEY";

const { createClient } = supabase;

alert("Vor createClient");

const client = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

alert("Nach createClient");

async function testSupabase() {

  alert("Button funktioniert");

  const { data, error } =
    await client.auth.getSession();

  if(error){
    alert(error.message);
    return;
  }

  alert("Supabase verbunden");

}

</script>

</body>
</html>
