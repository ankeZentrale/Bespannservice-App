<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RacketService | Bespannungsverwaltung</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--navy:#16324f;--blue:#1f66ff;--cyan:#22b8cf;--bg:#eef3f7;--card:#fff;--text:#172b4d;--muted:#64748b;--danger:#dc2626;--line:#e2e8f0}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}
    .shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:var(--navy);color:white;padding:24px 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin:0 8px 30px}.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center}
    nav button{width:100%;border:0;color:#cbd5e1;background:transparent;padding:12px 14px;border-radius:8px;text-align:left;cursor:pointer;margin:3px 0}nav button.active,nav button:hover{background:rgba(255,255,255,.12);color:white}
    main{padding:28px 34px;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{margin:0;font-size:26px}h2{margin:0 0 16px;font-size:18px}.actions{display:flex;gap:10px}
    button{font:inherit}.primary{border:0;background:var(--blue);color:white;border-radius:8px;padding:10px 16px;cursor:pointer}.secondary{border:1px solid var(--line);background:white;color:var(--text);border-radius:8px;padding:9px 13px;cursor:pointer}.danger{color:var(--danger);border:1px solid #fecaca;background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:16px;margin-bottom:20px}.stat{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(15,23,42,.05)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:7px}.card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(15,23,42,.05)}
    .toolbar{display:flex;gap:10px;margin-bottom:14px}input,select{width:100%;border:1px solid #ccd6e0;border-radius:8px;padding:10px 12px;background:white;color:var(--text)}.search{max-width:320px}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #edf2f7}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;background:#e8f1ff;color:#2455a4}.badge.ready{background:#dcfce7;color:#166534}.badge.progress{background:#fff7d6;color:#8a6200}
    .view{display:none}.view.active{display:block}dialog{width:min(560px,calc(100% - 32px));border:0;border-radius:14px;padding:0;box-shadow:0 20px 60px rgba(15,23,42,.25)}dialog::backdrop{background:rgba(15,23,42,.45)}.dialog-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialog-body{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.empty{text-align:center;padding:40px;color:var(--muted)}
    #authScreen{min-height:100vh;display:grid;place-items:center;padding:20px}.authCard{width:min(440px,100%);background:white;border-radius:16px;padding:28px;box-shadow:0 12px 35px rgba(15,23,42,.10)}.authCard h1{text-align:center;margin-bottom:8px}.authCard p{text-align:center;color:var(--muted);margin:0 0 20px}.authCard form{display:grid;gap:12px}.authToggle{text-align:center;margin-top:14px}.authToggle button{border:0;background:none;color:var(--blue);cursor:pointer}.message{font-size:13px;text-align:center!important}.hidden{display:none!important}
    @media(max-width:800px){.shell{grid-template-columns:1fr}aside{position:sticky;top:0;z-index:5;padding:12px}.brand{display:none}nav{display:flex}nav button{text-align:center}main{padding:20px 14px}.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}table{display:block;overflow-x:auto}.actions{display:none}}
  </style>
</head>
<body>
<div id="authScreen"><div class="authCard"><div class="brand" style="justify-content:center;color:var(--text);margin:0 0 12px"><div class="brand-mark">🎾</div>RacketService</div><h1 id="authTitle">Anmelden</h1><p id="authSubtitle">Deine Aufträge und Schläger im Überblick</p><form id="authForm"><div id="registerFields" class="hidden"><div class="field" style="margin-bottom:12px"><label>Vorname</label><input name="firstname" autocomplete="given-name"></div><div class="field"><label>Nachname</label><input name="lastname" autocomplete="family-name"></div></div><div class="field"><label>E-Mail</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Passwort</label><input name="password" type="password" minlength="6" required autocomplete="current-password"></div><div class="field hidden" id="phoneField"><label>Telefon</label><input name="phone" autocomplete="tel"></div><button class="primary" id="authSubmit">Anmelden</button><p class="message" id="authMessage"></p></form><div class="authToggle"><button id="authToggle">Noch kein Konto? Jetzt registrieren</button></div></div></div>

<div class="shell hidden" id="app"><aside><div class="brand"><div class="brand-mark">🎾</div>RacketService</div><nav id="nav"><button class="active" data-view="dashboard">Übersicht</button><button data-view="orders">Meine Aufträge</button><button class="adminOnly" data-view="customers">Kunden</button><button class="adminOnly" data-view="rackets">Schläger</button></nav><button class="secondary" id="logoutBtn" style="width:100%;margin-top:20px">Abmelden</button></aside><main><header><h1 id="pageTitle">Übersicht</h1><div class="actions"><button class="secondary" id="refreshBtn">Aktualisieren</button></div></header>
  <section id="dashboard" class="view active"><div class="cards"><div class="stat adminOnly"><small>Kunden</small><strong id="customerCount">0</strong></div><div class="stat adminOnly"><small>Schläger</small><strong id="racketCount">0</strong></div><div class="stat"><small>Aktive Aufträge</small><strong id="orderCount">0</strong></div></div><div class="card"><h2>Meine Aufträge</h2><div id="recentOrders"></div></div></section>
  <section id="orders" class="view"><div class="card"><table><thead><tr><th>Kunde</th><th>Schläger</th><th>Saite</th><th>Zuggewicht</th><th>Status</th></tr></thead><tbody id="orderTable"></tbody></table></div></section>
  <section id="customers" class="view"><div class="card"><div class="toolbar"><input class="search" id="customerSearch" placeholder="Kunden suchen…"></div><table><thead><tr><th>Name</th><th>Telefon</th><th>E-Mail</th></tr></thead><tbody id="customerTable"></tbody></table></div></section>
  <section id="rackets" class="view"><div class="card"><table><thead><tr><th>Kunde</th><th>Marke / Modell</th><th>Griff</th></tr></thead><tbody id="racketTable"></tbody></table></div></section>
</main></div>

<script>
const SUPABASE_URL='https://jaiopyopglxuvrrjdqrk.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_KRRgCz4faQD2tm-gKUEtag_dXf0wwom';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let isRegister=false,isAdmin=false,user=null,profile=null,customers=[],rackets=[],orders=[];
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

$('#authToggle').onclick=()=>{isRegister=!isRegister;$('#authTitle').textContent=isRegister?'Registrieren':'Anmelden';$('#authSubtitle').textContent=isRegister?'Erstelle dein Kundenkonto':'Deine Aufträge und Schläger im Überblick';$('#authSubmit').textContent=isRegister?'Registrieren':'Anmelden';$('#authToggle').textContent=isRegister?'Bereits ein Konto? Anmelden':'Noch kein Konto? Jetzt registrieren';$('#registerFields').classList.toggle('hidden',!isRegister);$('#phoneField').classList.toggle('hidden',!isRegister);$('#authForm input[name="password"]').autocomplete=isRegister?'new-password':'current-password';};

$('#authForm').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),email=d.get('email'),password=d.get('password'),msg=$('#authMessage');msg.textContent='Bitte warten…';try{if(isRegister){const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{firstname:d.get('firstname'),lastname:d.get('lastname'),phone:d.get('phone')}}});if(error)throw error;if(data.user){const {error:profileError}=await supabaseClient.from('customers').upsert({id:data.user.id,firstname:d.get('firstname'),lastname:d.get('lastname'),phone:d.get('phone'),email});if(profileError)throw profileError;}}else{const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;}await startSession();}catch(error){msg.textContent=error.message;}};

async function startSession(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){$('#authScreen').classList.remove('hidden');$('#app').classList.add('hidden');return;}user=session.user;$('#authScreen').classList.add('hidden');$('#app').classList.remove('hidden');await loadData();}

async function loadData(){const {data:adminRows}=await supabaseClient.from('customers').select('is_admin').eq('id',user.id).maybeSingle();isAdmin=!!adminRows?.is_admin;document.querySelectorAll('.adminOnly').forEach(el=>el.classList.toggle('hidden',!isAdmin));
 const {data:ownProfile}=await supabaseClient.from('customers').select('*').eq('id',user.id).maybeSingle();profile=ownProfile;
 if(isAdmin){const [cr,rr,or]=await Promise.all([supabaseClient.from('customers').select('*'),supabaseClient.from('rackets').select('*'),supabaseClient.from('orders').select('*')]);customers=cr.data||[];rackets=rr.data||[];orders=or.data||[];}else{customers=ownProfile?[ownProfile]:[];const [rr,or]=await Promise.all([supabaseClient.from('rackets').select('*').eq('customer_id',user.id),supabaseClient.from('orders').select('*').eq('customer_id',user.id)]);rackets=rr.data||[];orders=or.data||[];}render();}

function customerName(id){const c=customers.find(x=>x.id===id);return c?`${c.firstname||''} ${c.lastname||''}`.trim():''}function racketName(id){const r=rackets.find(x=>x.id===id);return r?r.model||r.name||'Schläger':''}
function render(){const active=orders.filter(o=>o.status!=='Abgeholt');$('#customerCount').textContent=customers.length;$('#racketCount').textContent=rackets.length;$('#orderCount').textContent=active.length;
 $('#orderTable').innerHTML=orders.map(o=>`<tr><td>${esc(customerName(o.customer_id||o.customerId))}</td><td>${esc(racketName(o.racket_id||o.racketId))}</td><td>${esc(o.string||o.strings||'—')}</td><td>${esc(o.tension||'—')} kg</td><td><span class="badge ${o.status==='Fertig'?'ready':o.status==='In Arbeit'?'progress':''}">${esc(o.status||'Neu')}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Keine Aufträge vorhanden</td></tr>';
 $('#recentOrders').innerHTML=orders.length?`<table><thead><tr><th>Schläger</th><th>Saite</th><th>Status</th></tr></thead><tbody>${orders.slice(0,5).map(o=>`<tr><td>${esc(racketName(o.racket_id||o.racketId))}</td><td>${esc(o.string||o.strings||'—')}</td><td><span class="badge">${esc(o.status||'Neu')}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Noch keine Aufträge vorhanden</div>';
 $('#customerTable').innerHTML=customers.map(c=>`<tr><td><b>${esc(c.firstname||'')} ${esc(c.lastname||'')}</b></td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Keine Kunden vorhanden</td></tr>';
 $('#racketTable').innerHTML=rackets.map(r=>`<tr><td>${esc(customerName(r.customer_id||r.customerId))}</td><td><b>${esc(r.model||r.name||'—')}</b></td><td>${esc(r.grip||'—')}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Keine Schläger vorhanden</td></tr>';}

document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');$('#pageTitle').textContent=b.textContent;});
$('#logoutBtn').onclick=async()=>{await supabaseClient.auth.signOut();startSession();};$('#refreshBtn').onclick=loadData;$('#customerSearch').oninput=e=>{const q=e.target.value.toLowerCase();[...$('#customerTable').rows].forEach(row=>row.style.display=row.textContent.toLowerCase().includes(q)?'':'none');};
supabaseClient.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')startSession();});startSession();
</script>
</body>
</html>
